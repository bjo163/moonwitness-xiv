# Optional full development stack. The base stack starts PostgreSQL and the local ClamAV scanner.
services:
  api:
    build:
      context: .
      target: build
    command: ['pnpm', '--filter', '@moonwitness/api', 'dev']
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/moonwitness_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      WHATSAPP_GATEWAY_URL: ${WHATSAPP_GATEWAY_URL:-https://wa.moonwitness.biz.id}
      WHATSAPP_GATEWAY_USERNAME: ${WHATSAPP_GATEWAY_USERNAME:-moonwitness}
      WHATSAPP_GATEWAY_PASSWORD: ${WHATSAPP_GATEWAY_PASSWORD:-moonwitness}
      WHATSAPP_GATEWAY_TIMEOUT_MS: ${WHATSAPP_GATEWAY_TIMEOUT_MS:-20000}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      WHATSAPP_CLAMAV_URL: tcp://clamav:3310
      ATTACHMENT_STORAGE_DIR: /var/lib/moonwitness/attachments
      # Defaults keep the stack bootable with one command. Set ATTACHMENT_STORAGE_DRIVER=s3 and
      # provide the Garage key pair in .env to write dev attachments to the shared bucket.
      ATTACHMENT_STORAGE_DRIVER: ${ATTACHMENT_STORAGE_DRIVER:-local}
      ATTACHMENT_S3_ENDPOINT: ${ATTACHMENT_S3_ENDPOINT:-https://s3.moonwitness.biz.id}
      ATTACHMENT_S3_REGION: ${ATTACHMENT_S3_REGION:-garage}
      ATTACHMENT_S3_BUCKET: ${ATTACHMENT_S3_BUCKET:-moonwitness-attachments}
      ATTACHMENT_S3_ACCESS_KEY: ${ATTACHMENT_S3_ACCESS_KEY:-}
      ATTACHMENT_S3_SECRET_KEY: ${ATTACHMENT_S3_SECRET_KEY:-}
      ATTACHMENT_S3_FORCE_PATH_STYLE: ${ATTACHMENT_S3_FORCE_PATH_STYLE:-true}
    ports: ['127.0.0.1:3000:3000']
    volumes: [whatsapp_dev_attachments:/var/lib/moonwitness/attachments]
    depends_on:
      postgres: { condition: service_healthy }
      clamav: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
  board:
    build:
      context: .
      target: build
    command: ['pnpm', '--filter', '@moonwitness/board', 'dev']
    environment:
      BOARD_API_TARGET: http://api:3000
    ports: ['127.0.0.1:5173:5173']
    depends_on:
      api: { condition: service_healthy }
  outbox-worker:
    build:
      context: .
      target: build
    command: ['pnpm', '--filter', '@moonwitness/api', 'jobs:outbox']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/moonwitness_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      WHATSAPP_GATEWAY_URL: ${WHATSAPP_GATEWAY_URL:-https://wa.moonwitness.biz.id}
      WHATSAPP_GATEWAY_USERNAME: ${WHATSAPP_GATEWAY_USERNAME:-moonwitness}
      WHATSAPP_GATEWAY_PASSWORD: ${WHATSAPP_GATEWAY_PASSWORD:-moonwitness}
      WHATSAPP_CLAMAV_URL: tcp://clamav:3310
      ATTACHMENT_STORAGE_DIR: /var/lib/moonwitness/attachments
      ATTACHMENT_STORAGE_DRIVER: ${ATTACHMENT_STORAGE_DRIVER:-local}
      ATTACHMENT_S3_ENDPOINT: ${ATTACHMENT_S3_ENDPOINT:-https://s3.moonwitness.biz.id}
      ATTACHMENT_S3_REGION: ${ATTACHMENT_S3_REGION:-garage}
      ATTACHMENT_S3_BUCKET: ${ATTACHMENT_S3_BUCKET:-moonwitness-attachments}
      ATTACHMENT_S3_ACCESS_KEY: ${ATTACHMENT_S3_ACCESS_KEY:-}
      ATTACHMENT_S3_SECRET_KEY: ${ATTACHMENT_S3_SECRET_KEY:-}
      ATTACHMENT_S3_FORCE_PATH_STYLE: ${ATTACHMENT_S3_FORCE_PATH_STYLE:-true}
    volumes: [whatsapp_dev_attachments:/var/lib/moonwitness/attachments]
    depends_on:
      postgres: { condition: service_healthy }
      clamav: { condition: service_healthy }
volumes:
  whatsapp_dev_attachments:
