services:
  clamav:
    image: clamav/clamav-debian:1.5.4
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    volumes:
      - clamav_db:/var/lib/clamav

  board:
    build:
      context: .
      target: board-runtime
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:5173}
    image: moonwitness-board:production
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
      - /app/apps/board/.next/cache:size=64m,noexec,nosuid,uid=1000,gid=1000,mode=0755
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1:${BOARD_PORT:-4174}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  api:
    build: .
    image: moonwitness-api:production
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    environment: &app_environment
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the managed PostgreSQL connection URL}
      JWT_SECRET: ${JWT_SECRET:?Set a persistent random JWT_SECRET of at least 32 characters}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      WHATSAPP_GATEWAY_URL: ${WHATSAPP_GATEWAY_URL:?Set the GoWA REST API URL}
      WHATSAPP_GATEWAY_USERNAME: ${WHATSAPP_GATEWAY_USERNAME:?Set the GoWA Basic Auth username}
      WHATSAPP_GATEWAY_PASSWORD: ${WHATSAPP_GATEWAY_PASSWORD:?Set the GoWA Basic Auth password}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      WHATSAPP_CLAMAV_URL: tcp://clamav:3310
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_TO_FILE: 'false'
      LOG_PRETTY: 'false'
      PRINT_ROUTES: 'false'
      ATTACHMENT_STORAGE_DIR: ${ATTACHMENT_STORAGE_DIR:-/var/lib/moonwitness/attachments}
      ATTACHMENT_STORAGE_DRIVER: ${ATTACHMENT_STORAGE_DRIVER:-s3}
      ATTACHMENT_S3_ENDPOINT: ${ATTACHMENT_S3_ENDPOINT:-https://s3.moonwitness.biz.id}
      ATTACHMENT_S3_REGION: ${ATTACHMENT_S3_REGION:-garage}
      ATTACHMENT_S3_BUCKET: ${ATTACHMENT_S3_BUCKET:-moonwitness-attachments}
      ATTACHMENT_S3_ACCESS_KEY: ${ATTACHMENT_S3_ACCESS_KEY:?Set the Garage bucket key ID (GK...)}
      ATTACHMENT_S3_SECRET_KEY: ${ATTACHMENT_S3_SECRET_KEY:?Set the Garage bucket key secret}
      ATTACHMENT_S3_FORCE_PATH_STYLE: ${ATTACHMENT_S3_FORCE_PATH_STYLE:-true}
      JOB_HANDLERS_MODULE: ${JOB_HANDLERS_MODULE:-}
      OUTBOX_HANDLERS_MODULE: ${OUTBOX_HANDLERS_MODULE:-}
    volumes:
      - type: volume
        source: whatsapp_attachments
        target: /var/lib/moonwitness/attachments
        read_only: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      clamav:
        condition: service_healthy

  jobs-worker:
    image: moonwitness-api:production
    command: ['node', 'dist/commands/jobs-worker.js']
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 2m
    healthcheck:
      disable: true
    environment: *app_environment

  jobs-scheduler:
    image: moonwitness-api:production
    command: ['node', 'dist/commands/jobs-scheduler.js']
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      disable: true
    environment: *app_environment

  outbox-worker:
    image: moonwitness-api:production
    command: ['node', 'dist/commands/outbox-worker.js']
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 2m
    healthcheck:
      disable: true
    environment: *app_environment

volumes:
  whatsapp_attachments:
  clamav_db:
